# Runs the same two test commands the README documents, so a push to GitHub
# and a local run agree on what "the suite" means. (It was written before the
# repository had a remote; it has run on hosted macOS since, and the timeout
# and concurrency comments below reason from what those runs showed.)
#
# The two test jobs run the shared `testExample` scheme, which means both run
# `testExample.xctestplan` — English *and* German. That is deliberate: the
# German configuration is the app's localization check, and a check that only
# runs when someone remembers to ask for it is not a check. The third job is
# the advisory formatter; it builds nothing and can only ever print.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One live run per pull request. A new push supersedes the run in flight,
# which otherwise keeps three macOS jobs busy producing a result nobody will
# read. That matters more than it sounds: hosted macOS allows five concurrent
# jobs, this workflow uses three per run, and two stale runs are enough to
# queue the one that counts.
#
# Off a pull request the group is the commit itself, so runs on `main` never
# share a group and never queue behind each other. That is the only shape
# that keeps every merge's result: a shared group would cancel the first
# run with `cancel-in-progress`, and even without it GitHub keeps at most
# one *pending* run per group, so three merges landing close together would
# drop the middle one while it waited. `cancel-in-progress` is scoped to
# pull requests for the same reason; on `main` there is nothing to cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `DEVELOPER_DIR` is set once per job rather than shelling out to
# `xcode-select` in each. `sudo xcode-select -s` mutates the runner
# system-wide; the environment variable is scoped to the job, needs no `sudo`,
# and is the mechanism Apple documents for picking a toolchain per invocation.
# Three copies of a `sudo` also meant three places to forget when the image's
# Xcode version moves.
jobs:
  unit-tests:
    name: Unit tests (English + German)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      # The first thing to go wrong on a runner image update is the Xcode path
      # above, and the failure it produces ("xcodebuild: command not found",
      # or a build against the wrong SDK) says nothing about the cause. Two
      # lines of output turn that into a diagnosis.
      - name: Show the available toolchains
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun swiftc --version
      - name: Test
        working-directory: testExample
        run: |
          xcodebuild test \
            -project testExample.xcodeproj \
            -scheme testExample \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath UnitTests.xcresult \
            -only-testing:testExampleTests
      # The coverage numbers the guide quotes come from this command. Printing
      # them on every run is what stops a documented percentage from quietly
      # becoming a historical one.
      - name: Coverage by target
        if: always()
        working-directory: testExample
        run: xcrun xccov view --report --only-targets UnitTests.xcresult

  ui-tests:
    name: UI tests (English + German)
    runs-on: macos-26
    # Not `continue-on-error`: a UI suite whose failures are advisory stops
    # being a suite. The timeout is the safety valve instead — the UI suite
    # takes roughly four minutes across both configurations on a local machine
    # (the full unit-plus-UI run is about six) and has taken about twenty on a
    # cold hosted runner, so forty-five is a hang, not a slow day. (The same
    # hedged figure is in the README, the guide's §2 and `CLAUDE.md`; if one
    # of the four ever moves, move all four.)
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show the available toolchains
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun swiftc --version
      # `SearchScreen.search(for:)` waits on the software keyboard, which
      # never appears while the simulator is paired with a hardware one.
      - name: Disconnect the simulator's hardware keyboard
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: Test
        working-directory: testExample
        run: |
          xcodebuild test \
            -project testExample.xcodeproj \
            -scheme testExample \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath UITests.xcresult \
            -only-testing:testExampleUITests
      # An `.xcresult` is a *bundle* — a directory Finder and Xcode present as
      # one file — and `upload-artifact` uploads the files inside a directory,
      # not the directory itself. Uploading the path directly therefore
      # produced an artifact whose contents were the bundle's innards with the
      # `.xcresult` wrapper stripped off, which `xcrun xcresulttool` cannot
      # open. Tarring first preserves the wrapper.
      - name: Archive the result bundle
        if: always()
        run: tar -czf UITests.xcresult.tgz -C testExample UITests.xcresult
      # A UI failure on a runner is otherwise a log line and nothing else: the
      # screenshots, the accessibility snapshots and the automatic
      # `XCTAttachment`s all live inside the result bundle. `if: always()` is
      # the point — the run that needs the bundle is the one that failed.
      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: UITests.xcresult.tgz
          retention-days: 7

  lint:
    name: swift-format (advisory)
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show the available toolchains
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun swiftc --version
      # Advisory on purpose, and the `|| true` is the whole design. The
      # repository's `.swift-format` is stricter than its prose — long comment
      # paragraphs are load-bearing teaching material here, and the line-length
      # rule does not know that. So the diagnostics are printed where a reviewer
      # can read them and are never allowed to fail the build. Drop the
      # `|| true` the day the codebase is clean and the rule earns a veto.
      #
      # No `--strict`: that flag only promotes warnings to a non-zero exit
      # status, which `|| true` immediately throws away again. Two flags
      # cancelling each other out read as a policy nobody quite settled, and
      # the documented measurement in the README runs this exact line.
      - name: Lint
        run: |
          xcrun swift-format lint --recursive testExample || true
