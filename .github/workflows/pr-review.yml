# Claude Code review on every pull request, submitted as a real review.
#
# The Tier 1 reviewer from the harness design, run through the official
# anthropics/claude-code-action rather than a hand-rolled `claude -p` call.
# The action runs the `/review-pr` skill with read-only tools, a turn cap and
# a dollar cap, validates the verdict against `verdict.schema.json`, and
# hands it back as the `structured_output` output. A small script then
# submits one pull request review:
#
#   pass              -> APPROVE
#   changes_requested -> REQUEST_CHANGES, findings inline on the diff
#   needs_human       -> COMMENT plus the needs-human-review label
#   did not run       -> COMMENT saying so, and the step fails, so the check
#                        is red and cannot be mistaken for a pass
#
# Approving needs the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General). A bot approval
# satisfies "require N approvals" and does not satisfy "require review from
# Code Owners", which is the intended split between Routine and the rest.
#
# The reviewer's skill, schema, hook and settings are checked out from the
# base branch, not the PR head. Now that the verdict can approve, a PR must
# not be able to supply the reviewer that approves it. The diff itself still
# comes from the PR, through gh.
#
# What the model can touch: Read, Grep, Glob and two read-only gh
# commands, under `--permission-mode dontAsk`. No Edit, no Write, and no
# `gh pr review` or `gh api`. A GitHub token is present in the model's
# environment so `gh pr view` and `gh pr diff` work; the control that keeps
# it from approving or commenting is the tool allowlist, not the absence of
# a token. The workspace is not marked trusted on the runner, so the
# checked-in `permissions.allow` list in `.claude/settings.json` is inert
# here and `--allowedTools` is the only allowlist in force. The API key is a
# repository secret the model never sees as text. Fork PRs do not receive
# secrets and are skipped explicitly.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Claude Code review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tolerant so that a failure here still reaches the submit step, which
      # posts a did-not-run comment and fails the job honestly.
      - name: Harness from the base branch
        id: harness
        continue-on-error: true
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          # Keep the PR's own harness readable as data at ./pr-harness, so a
          # PR that changes `.claude/` can still be reviewed in full while the
          # reviewer itself runs from the base branch.
          rm -rf pr-harness && cp -R .claude pr-harness
          rm -rf .claude
          git checkout "origin/$BASE" -- .claude
          chmod +x .claude/hooks/guard-critical-paths.sh
          schema_file=.claude/skills/review-pr/verdict.schema.json
          test -f "$schema_file" || { echo "base branch has no review skill; the review cannot run" >&2; exit 1; }
          schema="$(jq -c . "$schema_file")"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          # The publisher, which maps a verdict to APPROVE and holds the
          # write-capable token, also comes from the base branch. The
          # workflow file itself cannot: pull_request events always run the
          # PR's copy, and that residual gap is stated in the brief.
          mkdir -p base-scripts
          git show "origin/$BASE:.github/scripts/publish-review.sh" > base-scripts/publish-review.sh
          chmod +x base-scripts/publish-review.sh

      - name: Review
        id: review
        if: steps.harness.outcome == 'success'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_CI_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: >-
            --json-schema '${{ steps.harness.outputs.schema }}'
            --permission-mode dontAsk
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "You are reviewing pull request #${{ github.event.pull_request.number }}. Base branch: ${{ github.base_ref }}. The .claude/ directory in the workspace is the base branch's harness; the pull request's own .claude/ is at ./pr-harness/ for you to read as data."
            --max-turns 40
            --max-budget-usd 3
            --model claude-opus-5

      # The verdict travels through an environment variable, never through
      # string interpolation into the script, because it is model-authored.
      - name: Submit the pull request review
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          printf '%s' "${VERDICT:-}" > verdict.json
          if [ ! -s base-scripts/publish-review.sh ]; then
            # The base branch's publisher could not be staged, so no script
            # from this PR runs. Say so on the PR and fail the job.
            gh pr review "$PR" --comment --body "$(printf '## Claude review: did not run\n\nThe harness could not be staged from the base branch, so no review ran. This is not an approval.')"
            echo "base publisher unavailable; failing the step" >&2
            exit 1
          fi
          base-scripts/publish-review.sh verdict.json

      - name: Keep the raw verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: verdict.json
          retention-days: 7
          if-no-files-found: ignore
