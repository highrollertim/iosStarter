# Claude Code review on every pull request, submitted as a real review.
#
# The Tier 1 reviewer from the harness design, run through the official
# anthropics/claude-code-action rather than a hand-rolled `claude -p` call.
# The action runs the repo's own `/review-pr` skill with read-only tools, a
# turn cap and a dollar cap, validates the verdict against
# `verdict.schema.json`, and hands it back as the `structured_output` output.
# A small script then submits one pull request review:
#
#   pass              -> APPROVE
#   changes_requested -> REQUEST_CHANGES, findings inline on the diff
#   needs_human       -> COMMENT plus the needs-human-review label
#   did not run       -> COMMENT saying so, never an approval
#
# Approving needs the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General). A bot approval
# satisfies "require N approvals" and does not satisfy "require review from
# Code Owners", which is the intended split between Routine and the rest.
#
# What the model can touch: Read, Grep, Glob and a few read-only git and gh
# commands. No Edit, no Write. The GitHub token is held by the publish step,
# not the model, and the API key is a repository secret the model never sees
# as text. Fork PRs do not receive secrets and are skipped explicitly.
#
# The skill and hook live in this repo's `.claude/`, so a PR can change what
# the reviewer runs. Acceptable for a personal experiment; the company
# version checks `.claude/` out of a pinned harness repo instead.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Claude Code review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same PreToolUse guard that stops a laptop edit stops the reviewer.
      - name: Prepare the harness
        id: harness
        run: |
          chmod +x .claude/hooks/guard-critical-paths.sh
          echo "schema=$(jq -c . .claude/skills/review-pr/verdict.schema.json)" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_CI_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: >-
            --json-schema '${{ steps.harness.outputs.schema }}'
            --permission-mode dontAsk
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "You are reviewing pull request #${{ github.event.pull_request.number }}. Base branch: ${{ github.base_ref }}."
            --max-turns 40
            --max-budget-usd 3
            --model claude-opus-5

      # The verdict travels through an environment variable, never through
      # string interpolation into the script, because it is model-authored.
      - name: Submit the pull request review
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          printf '%s' "${VERDICT:-}" > verdict.json
          .github/scripts/publish-review.sh verdict.json

      - name: Keep the raw verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: verdict.json
          retention-days: 7
          if-no-files-found: ignore
